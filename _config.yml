title: "Bruno Magalhaes"
author:
  name: Bruno Magalhaes
  email: "brunomaga+blog@gmail.com"
repository: brunomaga/brunomaga.github.io
assets: /assets
resources_permalink: /#resources-table
publications_permalink: /publications/
google_scholar: https://scholar.google.com/citations?user=pirWLLgAAAAJ
baseurl: ""
url: "https://brunomaga.github.io"

# for the links to the EPFL courses in the resources page
epfl_statistics: https://github.com/brunomaga/Statistics_EPFL/blob/main/
epfl_machine_learning: https://github.com/brunomaga/MachineLearning_EPFL/blob/master/

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-redirect-from

permalink: /:title  # /title instead of /YY/mm/dd/categories/title

# pages that set no layout (the READMEs of the asset folders) are laid out like posts
defaults:
  - scope:
      path: ""
    values:
      layout: post

# files that are not pages of the site: the build files (a list here replaces Jekyll's default one) and the notes
# for Claude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - CLAUDE.md
