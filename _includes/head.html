<!-- adapted from https://github.com/jekyll/minima/blob/2.5-stable/_includes/head.html -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <link href="{{ "/favicon.ico" | relative_url }}" rel="shortcut icon">

  <!-- font awesome for social media icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.2/css/all.css">

  <!-- academicons to add missing icons to font awesome (e.g. google scholar) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

  <!-- MathJax. tags:'all' numbers equations so \ref{...} resolves -->
  <script>window.MathJax = { tex: { tags: 'all' } };</script>
  <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

  <style>
    /* ===== Images ===== */

    img { height: auto; }

    /* ===== Heading rhythm (h1 is the page title) ===== */

    h2 { margin-top: 40px; }
    h3 { margin-top: 20px; }
    h4 { margin-top: 10px; }
    h5 { margin-top: 5px; }

    /* ===== Callout panels ===== */

    .info-panel,
    .info-warning,
    .info-danger {
      max-width: 720px;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .info-panel   { background-color: #e9f0f6; }
    .info-warning { background-color: #fff3cd; }
    .info-danger  { background-color: #f8d7da; }

    .info-panel h2, .info-panel p,
    .info-warning h2, .info-warning p,
    .info-danger h2, .info-danger p { margin-bottom: 0; }

    .info-panel h2,
    .info-warning h2,
    .info-danger h2 { margin-top: 0; }

    /* ===== Labels (post date, category and tags; resource types on the home page) ===== */

    .post-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 0.6em;
    }

    .post-label {
      padding: 6px 9px 4px;  /* uppercase text has no descenders: more top padding centres it */
      border: 1px solid #e4e4e4;
      border-radius: 3px;
      background-color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.7rem;
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #777;
      white-space: nowrap;
    }

    /* where supported, trim the line box to the capitals and centre them exactly */
    @supports (text-box: trim-both cap alphabetic) {
      .post-label {
        padding: 7px 9px;
        text-box: trim-both cap alphabetic;
      }
    }

    /* strongest first: date in the link colour, category in mid grey, tags in light grey (default above) */
    .post-label--date     { border-color: #2a7ae2; color: #2a7ae2; }
    .post-label--category { border-color: #999;    color: #444; }

    /* resource types on the home page: equal-width labels in a first column as wide as the widest one,
       a small gap before the titles, and less vertical padding than on post pages so the rows keep
       their height */
    #resources-table td:first-child {
      width: 1%;  /* shrinks the column to its widest label */
      padding-right: 0;
    }

    #resources-table td + td { padding-left: 0.5em; }

    #resources-table .post-label {
      display: inline-block;
      box-sizing: border-box;
      width: 100%;
      padding-top: 3px;
      padding-bottom: 1px;
      text-align: center;
      vertical-align: middle;
    }

    @supports (text-box: trim-both cap alphabetic) {
      #resources-table .post-label {
        padding-top: 4px;
        padding-bottom: 4px;
      }
    }

    /* ===== Responsive table =====
       https://css-tricks.com/accessible-simple-responsive-tables/ */

    .Rtable {
      display: flex;
      flex-wrap: wrap;
      margin: 0.7em 0 0;
      padding: 0;
    }

    .Rtable-cell {
      box-sizing: border-box;
      flex-grow: 1;
      width: 100%;
      padding: 0.4em 1.2em;
      overflow: hidden;
      list-style: none;
    }

    .Rtable-cell > h1,
    .Rtable-cell > h2,
    .Rtable-cell > h3,
    .Rtable-cell > h4,
    .Rtable-cell > h5,
    .Rtable-cell > h6 { margin: 0; }

    .Rtable--2cols > .Rtable-cell { width: 50%; }
    .Rtable--3cols > .Rtable-cell { width: 33.33%; }
    .Rtable--4cols > .Rtable-cell { width: 25%; }
    .Rtable--5cols > .Rtable-cell { width: 20%; }
    .Rtable--6cols > .Rtable-cell { width: 16.66%; }

    @media all and (max-width: 500px) {
      .Rtable--collapse { display: block; }
      .Rtable--collapse > .Rtable-cell { width: 100% !important; }
      .Rtable--collapse > .Rtable-cell--foot { margin-bottom: 1em; }
    }
  </style>
</head>
