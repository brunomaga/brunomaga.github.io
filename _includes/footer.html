<!-- adapted from https://github.com/jekyll/minima/blob/2.5-stable/_includes/footer.html -->
<footer class="wrapper">

<table style='table-layout:fixed; border:none; border-collapse:collapse; cellspacing:0; cellpadding:0'><tr>
  {% if page.url != "/" %}
  <td style="border:none; text-align:left; padding-left:0">
    <a class="post-label post-label--back" href="{{ site.url }}"><i class="fas fa-arrow-left" aria-hidden="true"></i> back</a>
  </td>
  <td style="border:none; text-align:right">
    <!--<a href="mailto:{{ site.author.email }}?subject=About blog post: {{ post.title | url_encode }}"><i class="far fa-envelope" title="report bug"></i> <small>email me bugs or suggestions</small></a> -->
  </td>
  {% else %}
  {% endif %}
</tr>
</table>

</footer>
