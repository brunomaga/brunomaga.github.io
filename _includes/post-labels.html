<!-- back link, date, category and tags of a post as boxed labels; the back link alone on undated pages. Params: post, date_format -->
<div class="post-labels">
  {% include back-link.html %}
  {%- if include.post.date %}
  <time class="post-label post-label--date dt-published" itemprop="datePublished" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: include.date_format }}</time>
  {%- endif %}
  {%- for category in include.post.categories %}
  <span class="post-label post-label--category">{{ category }}</span>
  {%- endfor %}
  {%- for tag in include.post.tags %}
  <span class="post-label">{{ tag }}</span>
  {%- endfor %}
</div>
